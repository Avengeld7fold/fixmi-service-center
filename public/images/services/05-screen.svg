<svg width="400" height="780" viewBox="0 0 400 780" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Layer 5: Super Retina XDR OLED Display & Ceramic Shield Glass -->
  <defs>
    <linearGradient id="glassGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#1E232A" stopOpacity="0.85"/>
      <stop offset="50%" stopColor="#0F1318" stopOpacity="0.95"/>
      <stop offset="100%" stopColor="#080A0D" stopOpacity="0.98"/>
    </linearGradient>
    <linearGradient id="screenSheen" x1="0%" y1="0%" x2="100%" y2="80%">
      <stop offset="0%" stopColor="#FFFFFF" stopOpacity="0.2"/>
      <stop offset="30%" stopColor="#FFFFFF" stopOpacity="0.05"/>
      <stop offset="60%" stopColor="#FF6B00" stopOpacity="0.08"/>
      <stop offset="100%" stopColor="transparent"/>
    </linearGradient>
    <filter id="screenGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="20" floodColor="#000000" floodOpacity="0.95"/>
    </filter>
  </defs>

  <!-- Front Bezel & Ceramic Shield Glass -->
  <rect x="20" y="20" width="360" height="740" rx="54" fill="url(#glassGrad)" stroke="#FF6B00" strokeWidth="2" filter="url(#screenGlow)"/>

  <!-- Active Display Surface (120Hz ProMotion OLED Area) -->
  <rect x="32" y="32" width="336" height="716" rx="44" fill="#0A0C10"/>
  
  <!-- Subtle Diagonal Glass Reflection Sheen -->
  <path d="M32,32 L368,32 L200,748 L32,748 Z" fill="url(#screenSheen)" opacity="0.6"/>

  <!-- Dynamic Island (Pill Cutout at Top) -->
  <rect x="150" y="48" width="100" height="32" rx="16" fill="#000000" stroke="#222" strokeWidth="1"/>
  <!-- Front TrueDepth Camera & Face ID Sensor -->
  <circle cx="172" cy="64" r="7" fill="#0D2138" stroke="#1E88E5" strokeWidth="1"/>
  <circle cx="225" cy="64" r="5" fill="#1C0A28" stroke="#8E24AA" strokeWidth="1"/>

  <!-- Earpiece Speaker Mesh at Top Rim -->
  <rect x="180" y="28" width="40" height="4" rx="2" fill="#333"/>

  <!-- Touch Digitizer Grid Texture (Subtle) -->
  <path d="M40,150 L360,150 M40,300 L360,300 M40,450 L360,450 M40,600 L360,600" stroke="#FF6B00" strokeWidth="0.5" strokeDasharray="2 8" opacity="0.2"/>
  <path d="M120,40 L120,740 M200,90 L200,740 M280,40 L280,740" stroke="#FF6B00" strokeWidth="0.5" strokeDasharray="2 8" opacity="0.2"/>

  <!-- iOS Home Bar Indicator at Bottom -->
  <rect x="140" y="725" width="120" height="4" rx="2" fill="#FFFFFF" opacity="0.7"/>

  <!-- Label Part Watermark -->
  <text x="200" y="680" fill="#666" fontSize="11" fontFamily="monospace" textAnchor="middle" letterSpacing="3">PART 05 // OLED &amp; CERAMIC SHIELD</text>
</svg>
