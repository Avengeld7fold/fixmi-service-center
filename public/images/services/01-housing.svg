<svg width="400" height="780" viewBox="0 0 400 780" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Layer 1: Titanium Housing & Back Glass Frame -->
  <defs>
    <linearGradient id="housingGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#2A2A2E"/>
      <stop offset="50%" stopColor="#1C1C1F"/>
      <stop offset="100%" stopColor="#141416"/>
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#FF6B00" stopOpacity="0.8"/>
      <stop offset="50%" stopColor="#555555" stopOpacity="0.4"/>
      <stop offset="100%" stopColor="#FF6B00" stopOpacity="0.6"/>
    </linearGradient>
    <filter id="housingGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" floodColor="#000000" floodOpacity="0.8"/>
    </filter>
  </defs>

  <!-- Phone Body Outline -->
  <rect x="20" y="20" width="360" height="740" rx="54" fill="url(#housingGrad)" stroke="url(#borderGrad)" strokeWidth="2.5" filter="url(#housingGlow)"/>

  <!-- Camera Island Cutout -->
  <rect x="36" y="36" width="150" height="155" rx="36" fill="#18181B" stroke="#333338" strokeWidth="1.5"/>
  <circle cx="85" cy="85" r="28" fill="#121214" stroke="#444" strokeWidth="2"/>
  <circle cx="85" cy="142" r="28" fill="#121214" stroke="#444" strokeWidth="2"/>
  <circle cx="145" cy="114" r="28" fill="#121214" stroke="#444" strokeWidth="2"/>
  <!-- LiDAR & Flash -->
  <circle cx="145" cy="65" r="10" fill="#FFB800" fillOpacity="0.8"/>
  <circle cx="85" cy="114" r="7" fill="#222"/>

  <!-- MagSafe Magnetic Ring & Alignment Magnet -->
  <circle cx="200" cy="420" r="85" stroke="#44444A" strokeWidth="8" strokeDasharray="14 5" fill="none" opacity="0.6"/>
  <rect x="194" y="515" width="12" height="28" rx="4" fill="#44444A" opacity="0.6"/>

  <!-- Apple Logo Outline / Siluet -->
  <path d="M200,390 C194,390 188,394 185,398 C181,393 175,390 170,390 C160,390 152,398 152,410 C152,425 170,442 200,455 C230,442 248,425 248,410 C248,398 240,390 230,390 C225,390 219,393 215,398 C212,394 206,390 200,390 Z" fill="#333338" opacity="0.4" transform="scale(0.5) translate(200, 390)"/>

  <!-- Volume & Power Button Cutouts -->
  <rect x="15" y="180" width="5" height="42" rx="2" fill="#555"/>
  <rect x="15" y="240" width="5" height="42" rx="2" fill="#555"/>
  <rect x="380" y="210" width="5" height="60" rx="2" fill="#555"/>

  <!-- Label Part Watermark -->
  <text x="200" y="680" fill="#666" fontSize="11" fontFamily="monospace" textAnchor="middle" letterSpacing="3">PART 01 // HOUSING &amp; MAGSAFE</text>
</svg>
